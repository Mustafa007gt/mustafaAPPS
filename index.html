<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مصطفى جيمرز - التطبيقات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1f1f1f);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      background-color: #000000aa;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 999;
      box-shadow: 0 2px 10px #00f7ff80;
      backdrop-filter: blur(8px);
    }

    header h1 {
      margin: 0;
      font-size: 1.8em;
      color: #fff;
      text-shadow: 0 0 10px #00f7ff, 0 0 20px #00f7ff;
    }

    #searchInput {
      padding: 8px 12px; 
      font-size: 14px; 
      border-radius: 8px; 
      border: 2px solid #00f7ff30; 
      outline: none;
      background-color: #121212;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      transition: 0.3s;
    }

    #searchInput:focus {
      border-color: #00f7ff;
      box-shadow: 0 0 10px #00f7ff50;
    }

    /* حاوية أزرار التصنيفات النيونية المخصصة للتطبيقات */

        .apps-container {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
      padding: 15px; max-width: 1200px; margin: 0 auto;
    }

        .app-card {
      background: #121212dd; border-radius: 16px; padding: 10px; text-align: center;
      box-shadow: 0 0 20px #00f7ff30; transition: transform .3s, box-shadow .3s;
      position: relative; overflow: hidden;
    }

    .app-card.hidden {
      display: none !important;
    }

    .app-card:hover {
      transform: scale(1.02);
      box-shadow: 0 0 25px #00f7ff80;
    }

        .app-card img {
      width: 100%; height: 140px; object-fit: cover; border-radius: 10px;
      margin-bottom: 15px; transition: transform .4s ease; border: 1px solid #00f7ff20;
    }

    .app-card:hover img {
      transform: scale(1.04);
    }
    .app-card h2 {
      color: #00f7ff;
      text-shadow: 0 0 5px #00f7ff;
      margin: 10px 0 5px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      position: relative;
    }

    .app-card h2:active {
      overflow: visible;
      white-space: nowrap;
      z-index: 20;
    }

    /* نظام النجمات المضيئة المعزولة للتطبيقات */

    .rating-stars span:hover {
      transform: scale(1.2);
    }

    /* حاوية الأزرار السفلى المحدثة لزر التحميل الكامل */
    .card-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      width: 100%;
    }

    /* تأثيرات أزرار التحميل الكاملة RGB النيونية */
    .download-btn {
      position: relative;
      display: inline-block;
      padding: 12px 24px;
      color: #fff;
      font-weight: bold;
      text-decoration: none;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(270deg, #ff00f7, #00f7ff, #00ff88, #fffb00);
      background-size: 600% 600%;
      animation: rgb-glow 8s ease infinite;
      box-shadow: 0 0 15px #00f7ff88;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-size: 16px;
      width: 100%; /* تمدد كامل بعد حذف أيقونة اليوتيوب */
      border: none;
      outline: none;
      text-align: center;
    }

    .download-btn::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: inherit;
      z-index: -1;
      filter: blur(25px);
      animation: rgb-glow 8s ease infinite;
    }

    .download-btn.counting {
      background: #1a1a1a !important;
      border: 2px solid #ff00f7;
      animation: pulse-border 1.5s infinite;
      box-shadow: 0 0 15px #ff00f780;
      pointer-events: none;
      color: #ff00f7 !important;
      text-shadow: 0 0 8px #ff00f7;
    }

    .download-btn.counting::before {
      display: none;
    }

    @keyframes pulse-border {
      0% { border-color: #ff00f7; box-shadow: 0 0 10px #ff00f750; }
      50% { border-color: #00f7ff; box-shadow: 0 0 20px #00f7ff80; }
      100% { border-color: #ff00f7; box-shadow: 0 0 10px #ff00f750; }
    }

    .download-btn:not(.counting):hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px #00f7ffcc;
    }

    .download-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transform: skewX(-25deg);
      animation: shine 3s infinite;
    }

    @keyframes rgb-glow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes shine {
      0% { left: -75%; }
      50% { left: 125%; }
      100% { left: 125%; }
    }

    /* حاوية الرسائل المنبثقة التفاعلية Toast */
    #toast-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast-notification {
      background: rgba(18, 18, 18, 0.95);
      border: 2px solid #00f7ff;
      color: #fff;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 0 15px #00f7ff80, inset 0 0 10px #00f7ff20;
      text-shadow: 0 0 5px #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 250px;
      max-width: 350px;
      transform: translateX(120%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
      opacity: 0;
      backdrop-filter: blur(5px);
    }

    .toast-notification.show {
      transform: translateX(0);
      opacity: 1;
    }

    .toast-rating {
      border-color: #ffcc00;
      box-shadow: 0 0 15px #ffcc0080, inset 0 0 10px #ffcc0020;
    }

    /* الفوتر الفخم المطور للمنصة */
    footer {
      background-color: rgba(6, 5, 15, 0.9);
      margin-top: 60px;
      padding: 30px 20px;
      text-align: center;
      position: relative;
      border-top: 2px solid #ff00f7;
      box-shadow: 0 -5px 25px rgba(255, 0, 247, 0.15);
      backdrop-filter: blur(10px);
    }

    footer::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #ff00f7, #00f7ff, #ff00f7);
      background-size: 200% 100%;
      animation: rgb-glow 4s linear infinite;
    }

    .footer-content {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .footer-title {
      font-size: 1.5em;
      color: #fff;
      text-shadow: 0 0 10px #ff00f7, 0 0 20px #ff00f7;
      margin: 0;
    }

    .social-links {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 10px 0;
    }

    .social-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #121212;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      text-decoration: none;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .social-icon.telegram:hover {
      color: #0088cc;
      border-color: #0088cc;
      box-shadow: 0 0 15px rgba(0, 136, 204, 0.6);
      transform: translateY(-3px);
    }

    .footer-rights {
      color: #777;
      font-size: 13px;
      margin: 0;
      letter-spacing: 0.5px;
    }
    @media (max-width: 650px) {
      .apps-container { grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px; }
      .app-card { padding: 8px; border-radius: 15px; }
      .app-card img { height: 140px; }
      .app-card h2 { font-size: 1.15em; }
      .download-btn { padding: 10px 8px; font-size: 15px; }
    }
    @media (max-width: 390px) { .apps-container { grid-template-columns: repeat(2, 1fr); } }

    .app-name-bar {
      position: fixed;
      top: 75px;
      left: 12px;
      right: 12px;
      z-index: 10001;
      background: rgba(18, 18, 18, 0.97);
      color: #00f7ff;
      border: 1px solid #00f7ff;
      border-radius: 10px;
      padding: 10px 14px;
      text-align: center;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      font-weight: bold;
      white-space: nowrap;
      overflow-x: auto;
      box-shadow: 0 0 18px #00f7ff70;
      text-shadow: 0 0 6px #00f7ff;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }

    .app-name-bar.show {
      opacity: 1;
      transform: translateY(0);
    }

  </style>
</head>
<body>

  <a href="https://t.me/mustafaGWZ" target="_blank" style="
    position: fixed;
    bottom: 20px;
    left: 20px;

    padding: 0;
    border-radius: 50%;
    text-align: center;
    text-decoration: none;
    z-index: 1000;
  " title="تابعني على التليجرام">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" style="width:48px;height:48px;box-shadow: 0 0 15px #00f7ff80;border-radius: 50%;" />

    <div class="footer-content">
      <p class="footer-title">مصطفى جيمرز</p>

    </div>
  </footer>

  <script>

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', applyFilter);

    function applyFilter() {
      const query = searchInput.value.toLowerCase();
      const appCards = document.querySelectorAll('.app-card');

      appCards.forEach(card => {
        const title = card.querySelector('h2').textContent.toLowerCase();
        const matchesSearch = title.includes(query);

        if (matchesSearch) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    // نظام الإشعارات المنبثقة الـ Toast للتطبيقات
    function showToast(message, isRating = false) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast-notification';
      if(isRating) {
        toast.classList.add('toast-rating');
      }
      toast.innerHTML = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('show');
      }, 50);

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
          toast.remove();
        }, 400);
      }, 3000);
    }


    // إظهار الاسم الكامل للتطبيق عند لمس الاسم إذا كان أطول من المساحة المتاحة
    document.querySelectorAll('.app-card h2').forEach(title => {
      title.addEventListener('click', () => {
        const isTruncated = title.scrollWidth > title.clientWidth;
        if (!isTruncated) return;

        document.querySelectorAll('.app-name-bar').forEach(bar => bar.remove());

        const bar = document.createElement('div');
        bar.className = 'app-name-bar';
        bar.textContent = title.textContent;
        document.body.appendChild(bar);

        requestAnimationFrame(() => bar.classList.add('show'));

        setTimeout(() => {
          bar.classList.remove('show');
          setTimeout(() => bar.remove(), 250);
        }, 2500);
      });
    });

    // العداد التنازلي المطور عند تحميل التطبيقات
    function startDownload(event, element) {
      event.preventDefault(); 
      
      const targetUrl = element.getAttribute('href');
      const appTitle = element.parentElement.parentElement.querySelector('h2').textContent;
      let timeLeft = 3; 
      
      element.classList.add('counting');
      element.textContent = `تجهيز.. (${timeLeft})`;
      
      showToast(`🛡️ جاري تجهيز رابط آمن للملف: <br><span style="color:#00f7ff">${appTitle}</span>`);

      const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          element.classList.remove('counting');
          element.textContent = 'تحميل';
          window.open(targetUrl, '_blank'); 
        } else {
          element.textContent = `تجهيز.. (${timeLeft})`;
        }
      }, 1000);
    }
  </script>
